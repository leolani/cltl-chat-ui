<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leolani chat</title>

    <!-- stylesheets are conveniently separated into components -->
    <link rel="stylesheet" media="all" href="chat-bubble/component/styles/setup.css" />
    <link rel="stylesheet" media="all" href="chat-bubble/component/styles/says.css" />
    <link rel="stylesheet" media="all" href="chat-bubble/component/styles/reply.css" />
    <link rel="stylesheet" media="all" href="chat-bubble/component/styles/typing.css" />
    <link rel="stylesheet" media="all" href="chat-bubble/component/styles/input.css" />
    <link rel="stylesheet" media="all" href="annotorious/annotorious.css" />
    <link rel="stylesheet" media="all" href="chat.css" />
    <link rel="stylesheet" media="all" href="annotate.css" />
    <link rel="stylesheet" media="all" href="panels.css" />
    <link rel="stylesheet" media="all" href="status.css" />
    <link rel="stylesheet" media="all" href="display.css" />
  </head>
  <body>
    <div id="workspace">
      <!-- The conversation and the controls under it. The chat window fills
           #chat itself, so anything that belongs beneath its input field has to
           sit outside it, in this column. -->
      <div id="conversation">
        <!-- container element for chat window -->
        <div id="chat"></div>

        <!-- Left out unless the deployment configures a stop phrase; stop.js
             decides. -->
        <!-- What the backend's modules are doing. Left out unless the
             deployment configures a status topic; status.js decides. The
             timeline opens upward over the chat window, so the bar itself never
             moves the page. -->
        <div id="status-bar" hidden>
          <ol id="status-timeline" hidden></ol>
          <button id="status-toggle" type="button" aria-expanded="false" aria-controls="status-timeline">
            <span id="status-level" class="status-level" data-level="none"></span>
            <span id="status-source"></span>
            <span id="status-message">No status</span>
            <progress id="status-progress" max="1" hidden></progress>
            <span class="status-chevron" aria-hidden="true">&#9650;</span>
          </button>
        </div>

        <button id="stop-scenario" type="button" hidden disabled>Stop conversation</button>
      </div>

      <!-- The column beside the conversation. Which panels it offers depends on
           the deployment, so panels.js asks the service and hides the rest;
           nothing here assumes both exist. -->
      <aside id="side-panel">
        <div id="panel-tabs" role="tablist" aria-label="Panels">
          <button id="tab-annotator" type="button" role="tab"
                  aria-controls="annotator" aria-selected="true">Image</button>
          <button id="tab-monitor" type="button" role="tab"
                  aria-controls="monitor" aria-selected="false">Monitoring</button>
          <!-- Left out unless the deployment configures a display topic.
               display.js renames it after the latest page shown. -->
          <button id="tab-display" type="button" role="tab"
                  aria-controls="display" aria-selected="false" hidden>
            <span id="display-tab-label">Display</span>
            <span id="display-badge" hidden>new</span>
          </button>
        </div>

        <section id="annotator" role="tabpanel" aria-labelledby="tab-annotator">
          <label for="annotate-file">Upload an image, mark regions on it, and submit.</label>
          <input id="annotate-file" type="file" accept="image/*" />

          <div id="annotate-canvas">
            <p id="annotate-empty">No image yet.</p>
            <!-- Annotorious wraps this element and reads its natural size, so it
                 must be a real <img> in the document, not a background. -->
            <img id="annotate-image" alt="the image being annotated" style="display: none" />
          </div>

          <ul id="annotate-regions"></ul>

          <div id="annotate-controls">
            <button id="annotate-submit" type="button" disabled>Submit</button>
            <button id="annotate-clear" type="button" disabled>Clear regions</button>
          </div>

          <p id="annotate-status"></p>
        </section>

        <section id="monitor" role="tabpanel" aria-labelledby="tab-monitor" hidden>
          <!-- The page inside is served by cltl-monitoring, not from here, and
               in a containerised deployment it is a different origin. Its src is
               set by panels.js from the service's configuration: an absolute URL
               in this file would also fail the no-remote-assets test. -->
          <iframe id="monitor-frame" title="Monitoring"></iframe>
          <p id="monitor-status"></p>
        </section>

        <section id="display" role="tabpanel" aria-labelledby="tab-display" hidden>
          <!-- Pages other modules asked to have shown. Every url is checked by
               the service before it gets here, and set by display.js; nothing
               is written into this frame as markup. -->
          <div id="display-controls">
            <strong id="display-title">Display</strong>
            <label for="display-history" class="cltl-visually-hidden">Pages shown so far</label>
            <select id="display-history" disabled></select>
            <a id="display-open" href="about:blank" target="_blank" rel="noopener noreferrer" hidden>Open in new tab</a>
          </div>
          <iframe id="display-frame" title="Display" referrerpolicy="no-referrer"></iframe>
          <p id="display-status">Nothing to show yet.</p>
        </section>
      </aside>
    </div>

    <!-- Everything is served from this deployment: no CDN, no npm, no bundler.
         Load order matters — Annotorious defines the global annotate.js uses,
         and chat.js publishes the chat id annotate.js posts to. -->
    <script src="chat-bubble/component/Bubbles.js"></script>
    <script src="annotorious/annotorious.js"></script>
    <script src="chat.js"></script>
    <script src="annotate.js"></script>
    <script src="panels.js"></script>
    <script src="stop.js"></script>
    <script src="status.js"></script>
    <script src="display.js"></script>
  </body>
</html>
